<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ENHANCE by Hanan · Coming soon</title>
  <meta name="description" content="ENHANCE by Hanan, makeup artistry in Kuwait. Our website is coming soon.">
  <meta property="og:title" content="ENHANCE by Hanan">
  <meta property="og:description" content="Makeup artistry in Kuwait. Coming soon.">
  <meta property="og:url" content="https://enhancebyhanan.com/">
  <meta name="theme-color" content="#17120F">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Corinthia:wght@400&family=Jost:wght@300;400;500&family=Alexandria:wght@300&display=swap" rel="stylesheet">
  <style>
    /* Brand theme: direction 07 "Signature" (noir, pearl, champagne). */
    :root {
      --bg: #17120F;          /* noir */
      --ink: #F6F1EB;         /* pearl */
      --muted: #A99C91;       /* taupe, lightened for contrast on noir */
      --accent: #B8935E;      /* champagne */
      --font-display: "Bodoni Moda", "Didot", Georgia, serif;
      --font-script: "Corinthia", "Pinyon Script", cursive;
      --font-body: "Jost", "Helvetica Neue", Arial, sans-serif;
      --font-arabic: "Alexandria", "Geeza Pro", Tahoma, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    main { display: flex; flex-direction: column; align-items: center; animation: fade 1.6s ease both; }

    .logo { display: flex; flex-direction: column; align-items: center; }

    .wordmark {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(2.6rem, 10vw, 6.25rem);
      letter-spacing: 0.2em;
      padding-left: 0.2em;
      line-height: 1;
    }

    .by {
      margin: -0.28em 0 0 2.4em;
      font-family: var(--font-script);
      font-size: clamp(2rem, 7.6vw, 4.75rem);
      line-height: 1;
      color: var(--accent);
    }

    .rule { width: 3.5rem; height: 1px; background: var(--accent); margin: 2.75rem 0 2rem; border: 0; }

    .soon { margin: 0; font-size: 0.8rem; font-weight: 400; letter-spacing: 0.45em; text-transform: uppercase; padding-left: 0.45em; }

    .soon-ar { margin: 0.9rem 0 0; font-family: var(--font-arabic); font-size: 1rem; color: var(--muted); }

    .tagline {
      margin: 1.75rem 0 0;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.45em;
      padding-left: 0.45em;
      text-transform: uppercase;
      color: var(--accent);
    }

    footer { position: absolute; bottom: 2rem; left: 0; right: 0; font-size: 0.75rem; letter-spacing: 0.2em; }

    footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .3s, color .3s; }
    footer a:hover, footer a:focus-visible { color: var(--accent); border-color: var(--accent); }

    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } }
    @media (max-height: 520px) { footer { position: static; margin-top: 2.5rem; } }
  </style>
</head>
<body>
  <main>
    <h1 class="logo"><span class="wordmark">ENHANCE</span> <span class="by">by Hanan</span></h1>
    <hr class="rule">
    <p class="soon">Coming soon</p>
    <p class="soon-ar" lang="ar" dir="rtl">قريباً</p>
    <p class="tagline">Makeup artistry · Kuwait</p>
  </main>
  <footer>
    <a href="https://www.instagram.com/hanan.abdullah.makeup/" target="_blank" rel="noopener">@HANAN.ABDULLAH.MAKEUP</a>
  </footer>
</body>
</html>
