<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ENHANCE by Hanan · Coming soon</title>
  <meta name="description" content="ENHANCE by Hanan. Our website is coming soon.">
  <meta property="og:title" content="ENHANCE by Hanan">
  <meta property="og:description" content="Coming soon.">
  <meta property="og:url" content="https://enhancebyhanan.com/">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@300;400&display=swap" rel="stylesheet">
  <style>
    /* Brand: ENHANCE by Hanan, final logo B3-4. Black and white only. */
    :root {
      --noir: #000000;
      --blanc: #FFFFFF;
      --porcelain: #F3F1EE;   /* soft backgrounds */
      --stone: #B9B4AE;       /* lines */
      --graphite: #3A3A3A;    /* body text */
      --font: "Jost", "Futura", "Helvetica Neue", Arial, sans-serif;
      --font-arabic: "IBM Plex Sans Arabic", "Geeza Pro", Tahoma, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      background: var(--blanc);
      color: var(--noir);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
      animation: fade 1.6s ease both;
    }

    h1 { margin: 0; line-height: 0; }
    .logo { display: block; height: auto; }
    .logo-primary { width: min(560px, 80vw); }
    .logo-stacked { display: none; width: min(300px, 72vw); }

    .rule { width: 3rem; height: 1px; background: var(--stone); border: 0; margin: 3.5rem 0 2.25rem; }

    .soon {
      margin: 0;
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.5em;
      padding-left: 0.5em;
      text-transform: uppercase;
    }

    .soon-ar { margin: 0.9rem 0 0; font-family: var(--font-arabic); font-weight: 300; font-size: 1rem; color: var(--graphite); }


    .button {
      margin-top: 2.75rem;
      display: inline-block;
      padding: 1rem 2rem;
      border: 1px solid var(--noir);
      color: var(--noir);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      padding-right: calc(2rem - 0.3em);
      text-transform: uppercase;
      transition: background .25s, color .25s;
    }
    .button:hover, .button:focus-visible { background: var(--noir); color: var(--blanc); }

    footer {
      background: var(--porcelain);
      padding: 1.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--graphite);
    }

    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } }
    @media (max-width: 560px) {
      .logo-primary { display: none; }
      .logo-stacked { display: block; }
    }
  </style>
</head>
<body>
  <main>
    <h1>
      <img class="logo logo-primary" src="assets/logo-primary-black.svg" alt="ENHANCE by Hanan" width="1113" height="102">
      <img class="logo logo-stacked" src="assets/logo-stacked-black.svg" alt="ENHANCE by Hanan" width="649" height="133">
    </h1>
    <hr class="rule">
    <p class="soon">Coming soon</p>
    <p class="soon-ar" lang="ar" dir="rtl">قريباً</p>
    <a class="button" href="https://www.instagram.com/hanan.abdullah.makeup/" target="_blank" rel="noopener">Follow on Instagram</a>
  </main>
  <footer>© 2026 ENHANCE by Hanan · Kuwait</footer>
</body>
</html>
